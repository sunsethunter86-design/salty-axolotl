# Salty v7a (28 Oct): same 513 chats as v7, 2 epochs instead of 3 (v7 lost capability; eval loss best ~1-2 epochs). Shaun: "train the same v7 data with 2 passes".
# Gate: only after the Day 1 phone test passes and Shaun authorises training.
# Paths are WSL paths. See train/TRAINING_NOTES.md for the reasoning and risks.

# Meta's official weights, revision 0cb88a4f764b7a12671c53f0838cd831a0843b95.
# Read-only: Axolotl only reads this folder. Hashes in PROVENANCE.md.
base_model: /mnt/d/MuseTest/convert/Llama-3.2-3B-Instruct
tokenizer_type: AutoTokenizer

# Plain bf16 LoRA first. If it doesn't fit in 12 GB, switch to QLoRA:
# load_in_4bit: true, adapter: qlora (see TRAINING_NOTES.md).
load_in_8bit: false
load_in_4bit: false
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
# The embeddings and output head are tied in this model. Leave them alone.

datasets:
  - path: /mnt/d/MuseTest/experiments/salty/data/build/train.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
    train_on_eos: turn

# Must render exactly what tools/llama32_chat_notools.jinja renders at runtime
# for plain-string messages: same system header, same "Cutting Knowledge Date"
# line, no tool instructions, no date line.
chat_template: jinja
chat_template_jinja: |
  {{- bos_token }}
  {%- if messages[0]['role'] == 'system' %}
      {%- set system_message = messages[0]['content']|trim %}
      {%- set messages = messages[1:] %}
  {%- else %}
      {%- set system_message = "" %}
  {%- endif %}
  {{- "<|start_header_id|>system<|end_header_id|>\n\n" }}
  {{- "Cutting Knowledge Date: December 2023\n\n" }}
  {{- system_message }}
  {{- "<|eot_id|>" }}
  {%- for message in messages %}
      {{- '<|start_header_id|>' + message['role'] + '<|end_header_id|>\n\n' + message['content'] | trim + '<|eot_id|>' }}
  {%- endfor %}
  {%- if add_generation_prompt %}
      {{- '<|start_header_id|>assistant<|end_header_id|>\n\n' }}
  {%- endif %}

special_tokens:
  pad_token: "<|finetune_right_pad_id|>"

dataset_prepared_path: /mnt/d/MuseTest/experiments/salty/train/prepared-v7a
val_set_size: 0.05
output_dir: /mnt/d/MuseTest/experiments/salty/train/runs/salty-v7a

sequence_len: 1024
sample_packing: false
pad_to_sequence_len: false

micro_batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 2
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.05
optimizer: adamw_torch_fused
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
sdp_attention: true
flash_attention: false

logging_steps: 5
evals_per_epoch: 2
saves_per_epoch: 1
save_total_limit: 2
seed: 42
